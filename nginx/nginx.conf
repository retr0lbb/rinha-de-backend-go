events {
    worker_connections 1024;
}

http {
    upstream backend {
        server api1:9999;
        server api2:9999;
        keepalive 32;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts explícitos — evita 504s silenciosos contabilizados como HTTP errors
            proxy_connect_timeout 1s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;

            # Buffering leve para não bloquear conexões upstream enquanto cliente lento consome
            proxy_buffering       on;
            proxy_buffer_size     4k;
            proxy_buffers         8 4k;
        }

        location /debug/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}