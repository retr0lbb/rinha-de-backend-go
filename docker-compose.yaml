services:
  api1:
    image: retr0lbb/rinha-de-backend-retr0lbb-api2:latest  # sem build: .
    container_name: api1
    hostname: api1
    mem_limit: 140m
    cpus: "0.45"

  api2:
    image: retr0lbb/rinha-de-backend-retr0lbb-api2:latest  # sem build: .
    container_name: api2
    hostname: api2
    mem_limit: 140m
    cpus: "0.45"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    mem_limit: 50m
    cpus: "0.10"